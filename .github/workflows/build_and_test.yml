name: .NET Build and Test

env:
 DOTNET_CLI_TELEMETRY_OPTOUT: "true"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: cd src/Bison.CLI/ && dotnet restore
    - name: Build
      run: ./Build.sh
    - name: Test
      run: dotnet test tests/SimpleDB.Tests/ && dotnet test tests/Bison.CLI.Tests/