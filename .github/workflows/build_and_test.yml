name: .NET Build and Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: cd Bison.CLI/ && dotnet restore
    - name: Build
      run: ./Build.sh
    - name: Echo check
      run: echo works?
    - name: Test
      run: cd Bison.CLI/ && dotnet test --no-build --verbosity normal